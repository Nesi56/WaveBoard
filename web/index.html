<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>WaveBoard</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./desktop.js"></script>
    <script>
      // If the workspace script cannot start (old browser, blocked or failed
      // module), say so instead of showing a page that ignores every click.
      var waveboardStartError = "";
      window.addEventListener("error", function (event) {
        if (!waveboardStartError) waveboardStartError = event.message || (event.target && event.target.src) || "";
      }, true);
      setTimeout(function () {
        if (window.WaveBoardInput) return;
        var note = document.createElement("p");
        note.setAttribute("role", "alert");
        note.textContent = "WaveBoard could not start" +
          (waveboardStartError ? " (" + waveboardStartError + ")" : "") +
          ". Close the window and reopen WaveBoard. If this continues, check the desktop runtime installation.";
        note.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;margin:0;padding:14px 18px;" +
          "border-radius:14px;background:#304b3b;color:#fffefa;font:16px/1.4 Arial,sans-serif;z-index:2147483647";
        document.body.appendChild(note);
      }, 4000);
    </script>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./hands.js"></script>
  </head>
  <body data-page="home">
    <main id="main" tabindex="-1"></main>
    <button
      id="menu-toggle"
      class="menu-toggle"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="workspace-menu"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m5 9 7 7 7-7" />
      </svg>
    </button>
    <button
      id="menu-backdrop"
      class="menu-backdrop"
      aria-label="Close menu"
      tabindex="-1"
      hidden
    ></button>
    <section
      id="workspace-menu"
      class="workspace-menu"
      role="dialog"
      aria-label="Workspace menu"
      aria-modal="true"
      hidden
    >
      <div class="menu-header">
        <button class="menu-home" data-page="home">
          <span data-icon="home"></span>Home</button
        ><button id="menu-close" class="icon-button" aria-label="Close menu">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="menu-tools" class="menu-grid"></div>
      <div class="menu-footer">
        <button id="calibrate-hands-button" class="menu-tool">
          <span data-icon="touch"></span>Align hands
        </button>
        <button id="fullscreen-button" class="menu-tool">
          <span data-icon="expand"></span>Full screen</button
        ><button id="help-button" class="menu-tool">
          <span data-icon="help"></span>Help</button
        ><button id="settings-button" class="menu-tool">
          <span data-icon="settings"></span>Settings
        </button>
      </div>
    </section>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="local-file" hidden />
  </body>
</html>
